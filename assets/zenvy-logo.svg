<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <clipPath id="circle-clip">
      <rect width="100" height="100" rx="22"/>
    </clipPath>
  </defs>
  <!-- Background with subtle gold border -->
  <rect width="100" height="100" rx="22" fill="#FFFFFF"/>
  <rect x="1" y="1" width="98" height="98" rx="21" stroke="#fab62d" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Z Ribbon mark in authentic brand maroon #781128 -->
  <g clip-path="url(#circle-clip)">
    <!-- Top arch -->
    <path d="M14 6 C32 40 68 40 86 6 C96 6 96 14 86 32 C68 62 32 62 14 32 C4 14 4 6 14 6 Z" fill="#781128"/>
    <!-- Top inner circle (black) -->
    <circle cx="50" cy="2" r="22" fill="#1b0e0e"/>
    
    <!-- Central Z-bridge -->
    <path d="M12 92 C30 60 70 40 88 8 L72 8 C54 40 14 60 4 92 Z" fill="#781128"/>
    
    <!-- Bottom arch -->
    <path d="M14 94 C32 60 68 60 86 94 C96 94 96 86 86 68 C68 38 32 38 14 68 C4 86 4 94 14 94 Z" fill="#781128"/>
    <!-- Bottom inner circle (black) -->
    <circle cx="50" cy="98" r="22" fill="#1b0e0e"/>
    
    <!-- Brand accent yellow dot in center -->
    <circle cx="50" cy="50" r="5" fill="#fab62d"/>
  </g>
</svg>
